__________________________________________________________________________ 
name: Build Android APK 
 
on: 
  workflow_dispatch: 
 
jobs: 
  build-apk: 
    runs-on: ubuntu-latest 
    timeout-minutes: 30 
 
    steps: 
      - name: Checkout repository 
        uses: actions/checkout@v4 
 
      - name: Set up Java 
        uses: actions/setup-java@v4 
        with: 
          distribution: temurin 
          java-version: "17" 
 
      - name: Check Android project 
        run: | 
          if [ ! -d "android-app" ]; then 
            echo "The android-app folder was not found." 
            exit 1 
          fi 
 
      - name: Check Gradle wrapper 
        run: | 
          if [ ! -f "android-app/gradlew" ]; then 
            echo "The Gradle wrapper was not found." 
exit 1 
          fi 
 
          chmod +x android-app/gradlew 
 
      - name: Remove stale Gradle project cache 
        run: | 
          rm -rf android-app/.gradle 
          rm -rf android-app/app/build 
 
      - name: Build debug APK 
        working-directory: android-app 
        run: ./gradlew assembleDebug --stacktrace --no-daemon 
 
      - name: Verify APK 
        run: | 
          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk" 
 
          if [ ! -f "$APK_PATH" ]; then 
            echo "APK was not found at: $APK_PATH" 
            exit 1 
          fi 
 
          echo "APK generated successfully:" 
          ls -lh "$APK_PATH" 
 
      - name: Upload APK 
        uses: actions/upload-artifact@v4 
        with: 
          name: Generated-Android-APK 
          path: android-app/app/build/outputs/apk/debug/app-debug.apk 
          if-no-files-found: error 
          retention-days: 14 
